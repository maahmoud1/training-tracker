<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Training Pool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111114'/><rect x='18' y='42' width='64' height='16' rx='5' fill='%23fff'/><rect x='10' y='32' width='14' height='36' rx='5' fill='%23B3392E'/><rect x='76' y='32' width='14' height='36' rx='5' fill='%231B5E8F'/></svg>">
<style>
:root{
  --bg:#0E0E11; --card:#17171C; --card2:#1E1E25; --line:#2A2A33;
  --ink:#F2F2F5; --muted:#9A9AA6; --dim:#6E6E7A;
  --push:#D64A3B; --pull:#3D8FD1; --legs:#33A96B; --core:#9070D6;
  --ok:#33A96B; --warn:#E0A03A;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(72px + var(--safe-b));
  overscroll-behavior-y:contain;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hide{display:none !important}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:40;background:rgba(14,14,17,.92);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.bar{display:flex;align-items:center;gap:10px;height:52px}
.bar h1{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kick{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--muted);font-size:15px}
.iconbtn:active{background:#2A2A33}

/* ---------- tab bar ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(14,14,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
nav .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.02em}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}

/* ---------- generic ---------- */
.sec{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:22px 0 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pad{padding:14px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{background:var(--ink);color:#111;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;text-align:center;display:block;width:100%}
.btn:active{opacity:.8}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card2);color:var(--push);border:1px solid var(--line)}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--card2);color:var(--dim);text-transform:uppercase;vertical-align:middle}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--muted)}

/* ---------- day cards ---------- */
.daycard{display:flex;align-items:stretch;gap:0;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:100%;text-align:left}
.daycard .edge{width:5px;flex:none}
.daycard .body{padding:13px 14px;flex:1;min-width:0}
.daycard .nm{font-size:16px;font-weight:700;letter-spacing:-.01em}
.daycard .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.daycard .meta{font-size:11px;color:var(--dim);margin-top:6px;display:flex;gap:9px;flex-wrap:wrap}
.daycard .chev{align-self:center;padding-right:14px;color:var(--dim);font-size:19px}
.nextup{border-color:#3A3A46;box-shadow:0 0 0 1px #3A3A46 inset}
.badge{font-size:9.5px;font-weight:800;letter-spacing:.09em;padding:3px 7px;border-radius:6px;text-transform:uppercase;color:#fff}

/* ---------- exercise / sets ---------- */
.ex{border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.exhead{display:flex;gap:11px;padding:13px 14px 9px;align-items:flex-start}
.exnum{width:21px;height:21px;border-radius:6px;background:var(--card2);color:var(--dim);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.exname{font-size:15px;font-weight:700;line-height:1.25}
.exnote{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35}
.extarget{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;flex:none;text-align:right}
.setlist{padding:0 14px 12px}
.setrow{display:grid;grid-template-columns:20px 1fr 1fr 40px;gap:8px;align-items:center;margin-top:8px}
.setrow .sn{font-size:11px;font-weight:700;color:var(--dim);text-align:center}
.fld{position:relative}
.fld input{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:11px 10px 11px 11px;font-size:16px;font-weight:600;outline:none;
  -moz-appearance:textfield;
}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fld input:focus{border-color:#4A4A58;background:#22222A}
.fld input::placeholder{color:#4E4E5A;font-weight:500}
.fld .unit{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--dim);font-weight:700;pointer-events:none}
.setrow .tick{width:36px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font-size:15px}
.setrow.done .tick{background:rgba(51,169,107,.16);border-color:rgba(51,169,107,.4);color:var(--ok)}
.setrow.done .fld input{border-color:rgba(51,169,107,.28)}
.lastnote{font-size:11px;color:var(--dim);padding:7px 0 0 28px}
.hint{font-size:11px;padding:6px 0 0 28px;color:var(--warn);font-weight:600}
.hint.ok{color:var(--ok)}

.corebar{background:linear-gradient(90deg,rgba(144,112,214,.16),transparent 60%);border-left:3px solid var(--core)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 11px}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.03em}
.stat .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-top:2px}
.balance{display:flex;gap:8px;margin-top:10px}
.balance .b{flex:1;background:var(--card2);border-radius:9px;padding:9px 10px}
.balance .bn{font-size:16px;font-weight:800}
.balance .bl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.bar-track{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:7px}
.bar-fill{height:100%;border-radius:3px}

/* ---------- history ---------- */
.hrow{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left}
.hrow:last-child{border-bottom:0}
.hdot{width:9px;height:9px;border-radius:3px;flex:none}
.hmain{flex:1;min-width:0}
.hname{font-size:14.5px;font-weight:700}
.hmeta{font-size:11.5px;color:var(--dim);margin-top:2px}
.hvol{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}

/* ---------- chart ---------- */
.chart{width:100%;height:110px;display:block}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--ink)}
.chart .gl{stroke:var(--line);stroke-width:1}

/* ---------- toast / modal ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(84px + var(--safe-b));
  background:#F2F2F5;color:#111;padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:88%;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{position:fixed;inset:0;z-index:70;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;
  padding:8px 16px calc(20px + var(--safe-b));max-height:86vh;overflow:auto;max-width:560px;margin:0 auto;border-top:1px solid var(--line)}
.grab{width:38px;height:4px;border-radius:2px;background:#3A3A46;margin:8px auto 14px}

textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:15px;resize:vertical;min-height:76px;outline:none}
.empty{text-align:center;padding:44px 20px;color:var(--dim)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.5}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="grow">
      <div class="kick" id="topKick">Training Pool</div>
      <h1 id="topTitle">Today</h1>
    </div>
    <button class="iconbtn hide" id="backBtn" aria-label="Back">‹</button>
    <button class="iconbtn hide" id="notesBtn" aria-label="Session notes">✎</button>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav><div class="inner">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Train</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M12 7v5l3.5 2"/><circle cx="12" cy="12" r="9"/></svg>History</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Progress</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>More</button>
</div></nav>

<div id="toast"></div>

<div class="sheet" id="sheet">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="grab"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
/* =========================================================
   PROGRAM DEFINITION
   ========================================================= */
const CAT = {
  push:{label:'Push', colour:'var(--push)', hex:'#D64A3B'},
  pull:{label:'Pull', colour:'var(--pull)', hex:'#3D8FD1'},
  legs:{label:'Legs', colour:'var(--legs)', hex:'#33A96B'}
};

// e(name, sets, repLow, repHigh, unit, rir, note, isCore)
const e = (name,sets,lo,hi,unit,rir,note,core)=>({name,sets,lo,hi,unit:unit||'',rir,note,core:!!core});

const DAYS = [
{id:'pushA', cat:'push', name:'Push A', sub:'Chest primary', ex:[
  e('Machine Chest Press',4,8,12,'','2','Fixed path, shoulder-friendly. Main mass builder.'),
  e('Incline DB Press',3,8,12,'','2','Neutral grip. Full stretch at the bottom.'),
  e('Weighted Dips',3,8,12,'','1-2','Moderate depth, shoulders back.'),
  e('Seated DB Shoulder Press',3,8,12,'','1-2','Back-supported, no lower-back bracing.'),
  e('Cable Lateral Raise',4,12,15,'','1','Constant tension through the full range.'),
  e('Reverse Pec-Deck',3,12,20,'','1','Balances the most press-heavy day.'),
  e('Overhead Rope Tricep Ext.',3,10,15,'','1-0','Long-head bias, stretched position.'),
  e('Cable Crunch',3,10,15,'','1','Round the spine, don\u2019t just hip-hinge.',1),
  e('Pallof Press',2,10,12,'ea','1-2','Anti-rotation. Slow, no twisting.',1)
]},
{id:'pushB', cat:'push', name:'Push B', sub:'Shoulder & arm primary', ex:[
  e('Seated Machine Shoulder Press',4,8,12,'','2','Back-supported, no lower-back load.'),
  e('Machine Chest Press',3,8,12,'','2','Or neutral-grip DB. Joint-friendly angle.'),
  e('DB Lateral Raise',4,12,20,'','1','Lateral delt loves the extra sets.'),
  e('Rear Delt Cable Fly',3,12,15,'','1','Balances front-delt-heavy pressing.'),
  e('Weighted Dips',3,8,12,'','1-2','Or cable pushdown. Heavy tricep load.'),
  e('Incline Skull Crusher',3,10,15,'','1','Tricep long-head, stretched position.'),
  e('Hanging Leg Raise',3,8,15,'','1','Knees bent if needed. No swinging.',1),
  e('Weighted Decline Sit-Up',2,10,15,'','1-2','Plate at the chest. Add load over time.',1)
]},
{id:'pullA', cat:'pull', name:'Pull A', sub:'Back width', ex:[
  e('Weighted Pull-Ups',4,6,10,'','2','Or lat pulldown. Full stretch at the top.'),
  e('Chest-Supported Row',4,8,12,'','2','Heavy thickness, no lower-back bracing.'),
  e('Seated Cable Row',3,10,12,'','1-2','Controlled path, mid-back thickness.'),
  e('Straight-Arm Pulldown',3,12,15,'','1','Lat isolation, full stretch.'),
  e('Barbell / EZ-Bar Curl',3,8,12,'','1-2','Heaviest bicep loading of the session.'),
  e('Incline DB Curl',2,10,15,'','1','Deep stretch position for the biceps.'),
  e('Weighted Plank',3,30,45,'sec','1-2','Or ab wheel. Ribs down, glutes tight.',1),
  e('Cable Woodchop',2,12,15,'ea','1','Obliques. Drive from the hips.',1)
]},
{id:'pullB', cat:'pull', name:'Pull B', sub:'Back thickness + arms', ex:[
  e('Pendlay Row',4,6,10,'','2','Thickness with less lower-back cost.'),
  e('Single-Arm DB Row',3,10,12,'','1-2','Unilateral, full stretch each rep.'),
  e('Wide-Grip Lat Pulldown',3,10,12,'','1-2','Complements the rowing \u2014 width focus.'),
  e('Face Pull',3,15,20,'','1','Rear delt and upper back health.'),
  e('Machine Bicep Curl',3,8,12,'','1-2','Stable stretch-loading, easy on elbows.'),
  e('Hammer Curl',2,10,15,'','1','Brachialis \u2014 adds arm thickness.'),
  e('Suitcase Carry',3,30,40,'m ea','\u2013','Stay square, don\u2019t lean.',1),
  e('Cable Crunch',2,12,15,'','1','Direct loaded flexion to finish.',1)
]},
{id:'legsA', cat:'legs', name:'Legs A', sub:'Quad primary', ex:[
  e('Hack Squat',4,8,12,'','2','Squat stimulus, less spinal load.'),
  e('Leg Press',3,10,15,'','1-2','High-volume quad work, easy on joints.'),
  e('Walking Lunge',3,10,12,'ea','1-2','Unilateral, functional carryover.'),
  e('Leg Extension',3,12,15,'','1','Direct quad isolation, full contraction.'),
  e('Seated Leg Curl',4,12,15,'','1','Fourth set keeps hamstrings level with quads.'),
  e('Standing Calf Raise',4,10,15,'','1','Full stretch at the bottom.')
]},
{id:'legsB', cat:'legs', name:'Legs B', sub:'Hamstring & glute primary', ex:[
  e('Romanian Deadlift',4,6,10,'','2','Best hamstring stretch. Slow eccentric.'),
  e('Bulgarian Split Squat',3,10,12,'ea','1-2','Big stretch demand on the front leg.'),
  e('Hip Thrust',3,8,12,'','1-2','Direct glute load \u2014 squeeze at the top.'),
  e('Lying Leg Curl',3,12,15,'','1','Hamstring isolation, stretch position.'),
  e('Front / Goblet Squat',3,8,12,'','1-2','Upright torso, quad emphasis.'),
  e('Seated Calf Raise',4,12,15,'','1','Soleus \u2014 complements standing raise.')
]}];

const RULES = [
 ['Progression','Stay on a weight until you hit the top of the rep range on every set, then add 2.5\u20135%.'],
 ['Log it','Weight, reps and how it felt, every session. The log is what tells you you\u2019re progressing.'],
 ['Deload','Every 6\u20138 weeks, or after two sessions running where reps go backwards on the same weight. One week at ~60% of normal sets, stopping 3\u20134 reps short.'],
 ['Ordering','Don\u2019t run Pull B the day after Legs B. Pendlay rows and RDLs both tax the lower back.'],
 ['Balance','Once a month, count the push / pull / legs sessions. A self-directed rotation drifts to the days you enjoy.'],
 ['Core','Progress it like any other lift. Bodyweight-only ab work stalls fast.']
];

const dayById = id => DAYS.find(d=>d.id===id);

/* =========================================================
   STORAGE
   ========================================================= */
const KEY='trainingPool.v1';
let DB = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); d.sessions=d.sessions||[]; d.active=d.active||null; return d; }
  }catch(err){}
  return {sessions:[], active:null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(err){ toast('Storage full \u2014 export a backup'); } }

/* =========================================================
   HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }

function fmtDate(ts){
  const d=new Date(ts), n=new Date();
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const diff=Math.round((today-day)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Yesterday';
  if(diff<7) return diff+' days ago';
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
}
function daysAgo(ts){ return Math.floor((Date.now()-ts)/86400000); }
function target(ex){ return ex.sets+' \u00d7 '+ex.lo+'\u2013'+ex.hi+(ex.unit?' '+ex.unit:''); }

function doneSessions(){ return DB.sessions.slice().sort((a,b)=>b.date-a.date); }
function lastSessionFor(dayId){ return doneSessions().find(s=>s.dayId===dayId) || null; }

function sessionVolume(s){
  const day=dayById(s.dayId); if(!day) return 0;
  let v=0;
  day.ex.forEach((ex,i)=>{
    (s.entries[i]||[]).forEach(st=>{ const w=num(st.w), r=num(st.r); if(w&&r) v+=w*r; });
  });
  return Math.round(v);
}
function setsLogged(s){
  let n=0; Object.values(s.entries||{}).forEach(a=>a.forEach(st=>{ if(num(st.r)) n++; }));
  return n;
}

/* Is this exercise ready to progress? top of rep range on every set */
function readyToProgress(ex, sets){
  if(!sets || sets.length<ex.sets) return false;
  const filled = sets.filter(s=>num(s.r)!==null);
  if(filled.length<ex.sets) return false;
  return filled.every(s=>num(s.r)>=ex.hi);
}
/* Deload signal: reps went backwards on the same weight two sessions running */
function deloadSignal(){
  const flagged=[];
  DAYS.forEach(day=>{
    const hist=doneSessions().filter(s=>s.dayId===day.id).slice(0,3);
    if(hist.length<3) return;
    day.ex.forEach((ex,i)=>{
      const tot = hist.map(s=>{
        const sets=(s.entries[i]||[]).filter(x=>num(x.r)&&num(x.w));
        if(!sets.length) return null;
        const w = sets[0].w, reps = sets.reduce((a,x)=>a+num(x.r),0);
        return {w:num(w), reps};
      });
      if(tot.some(x=>!x)) return;
      const sameWeight = tot[0].w===tot[1].w && tot[1].w===tot[2].w;
      if(sameWeight && tot[0].reps<tot[1].reps && tot[1].reps<tot[2].reps){
        flagged.push(day.name+' \u2013 '+ex.name);
      }
    });
  });
  return flagged;
}

/* Suggested day: least recently trained category, then A/B alternation */
function suggestDay(){
  const hist=doneSessions();
  const catLast={};
  Object.keys(CAT).forEach(c=>{
    const s=hist.find(x=>{const d=dayById(x.dayId); return d&&d.cat===c;});
    catLast[c]= s? s.date : 0;
  });
  const cat=Object.keys(CAT).sort((a,b)=>catLast[a]-catLast[b])[0];
  const inCat=DAYS.filter(d=>d.cat===cat);
  const lastInCat=hist.find(x=>{const d=dayById(x.dayId); return d&&d.cat===cat;});
  if(lastInCat && lastInCat.dayId===inCat[0].id) return inCat[1].id;
  return inCat[0].id;
}

/* Ordering warning: Pull B the day after Legs B (and vice versa) */
function orderingWarning(dayId){
  const last=doneSessions()[0];
  if(!last) return null;
  if(daysAgo(last.date)>1) return null;
  const pair = (a,b)=> (last.dayId===a && dayId===b) || (last.dayId===b && dayId===a);
  if(pair('legsB','pullB')) return 'You trained '+dayById(last.dayId).name+' yesterday. Pendlay rows and RDLs both tax the lower back \u2014 consider swapping to another day.';
  return null;
}

function startDay(dayId){
  const warn=orderingWarning(dayId);
  const go=()=>{
    if(DB.active && DB.active.dayId!==dayId){
      openSheet(`<h2 style="font-size:18px">Session already in progress</h2>
        <div class="small muted" style="margin:9px 0 16px">You have an unfinished ${esc(dayById(DB.active.dayId).name)}. Starting a new one will discard it.</div>
        <button class="btn danger" data-act="discardstart">Discard and start ${esc(dayById(dayId).name)}</button>
        <div style="height:9px"></div>
        <button class="btn ghost" data-close>Keep the current session</button>`,
        {discardstart:()=>{ DB.active=null; save(); closeSheet(); newSession(dayId); }});
      return;
    }
    newSession(dayId);
  };
  if(warn){
    openSheet(`<h2 style="font-size:18px">Heads up</h2>
      <div class="small muted" style="margin:9px 0 16px">${esc(warn)}</div>
      <button class="btn" data-act="anyway">Train it anyway</button>
      <div style="height:9px"></div>

function newSession(dayId){
  const day=dayById(dayId);
  const entries={};
  day.ex.forEach((ex,i)=>{ entries[i]=Array.from({length:ex.sets},()=>({w:'',r:''})); });
  DB.active={dayId, date:Date.now(), entries, note:''};
  save();
  view.screen='session'; view.dayId=dayId; render(); window.scrollTo(0,0);
}

/* =========================================================
   ACTIVE SESSION
   ========================================================= */
function viewSession(){
  const s=DB.active; if(!s){ view.screen='list'; return viewHome(); }
  const day=dayById(s.dayId);
  const prev=lastSessionFor(s.dayId);
  setTop(CAT[day.cat].label+' \u00b7 '+fmtDate(s.date), day.name);

  let totalSets=0, doneSets=0;
  day.ex.forEach((ex,i)=>{ totalSets+=ex.sets; (s.entries[i]||[]).forEach(st=>{ if(num(st.r)) doneSets++; }); });
  const pct=totalSets?Math.round(doneSets/totalSets*100):0;

  let h=`<div class="card pad" style="margin-top:14px">
    <div class="row"><div class="grow"><div style="font-weight:700">${esc(day.sub)}</div>
    <div class="tiny dim" style="margin-top:2px">${doneSets} of ${totalSets} sets logged${prev?' \u00b7 last done '+fmtDate(prev.date).toLowerCase():''}</div></div>
    <div class="pill">${pct}%</div></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${CAT[day.cat].colour}"></div></div>
  </div>`;

  h+=`<div class="sec">Exercises</div><div class="card">`;
  day.ex.forEach((ex,i)=>{
    const sets=s.entries[i]||[];
    const prevSets = prev ? (prev.entries[i]||[]) : [];
    const prevTxt = prevSets.filter(x=>num(x.r)).map(x=>`${x.w||'\u2013'}\u00d7${x.r}`).join('  ');
    const ready = prev && readyToProgress(ex, prevSets);
    const nowReady = readyToProgress(ex, sets);

    h+=`<div class="ex${ex.core?' corebar':''}">
      <div class="exhead">
        <div class="exnum">${i+1}</div>
        <div class="grow">
          <div class="exname">${esc(ex.name)}${ex.core?' <span class="tag" style="color:var(--core)">Core</span>':''}</div>
          <div class="exnote">${esc(ex.note)}</div>
        </div>
        <div class="extarget">${target(ex)}<br><span class="dim tiny">RIR ${ex.rir}</span></div>
      </div>
      <div class="setlist">`;
    sets.forEach((st,j)=>{
      const done=num(st.r)!==null;
      const ph = prevSets[j] || {};
      h+=`<div class="setrow${done?' done':''}" data-ex="${i}" data-set="${j}">
        <div class="sn">${j+1}</div>
        <div class="fld"><input type="number" inputmode="decimal" step="0.5" data-f="w" value="${esc(st.w)}" placeholder="${ph.w?esc(ph.w):'\u2013'}"><span class="unit">${ex.unit==='sec'?'kg':'kg'}</span></div>
        <div class="fld"><input type="number" inputmode="numeric" data-f="r" value="${esc(st.r)}" placeholder="${ph.r?esc(ph.r):ex.lo+'\u2013'+ex.hi}"><span class="unit">${ex.unit==='sec'?'sec':'reps'}</span></div>
        <div class="tick" data-tick>${done?'\u2713':'\u25cb'}</div>
      </div>`;
    });
    if(prevTxt) h+=`<div class="lastnote">Last time &nbsp;${esc(prevTxt)}</div>`;
    if(nowReady) h+=`<div class="hint ok">\u2713 Top of the range on every set \u2014 add 2.5\u20135% next time.</div>`;
    else if(ready) h+=`<div class="hint">You hit the top of the range last time \u2014 go up 2.5\u20135% today.</div>`;
    h+=`</div></div>`;
  });
  h+=`</div>`;

  if(s.note) h+=`<div class="card pad" style="margin-top:14px"><div class="tiny dim" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700">Notes</div><div class="small" style="margin-top:5px;white-space:pre-wrap">${esc(s.note)}</div></div>`;

  h+=`<div style="height:18px"></div>
    <button class="btn" data-act="finish">Finish session</button>
    <div style="height:9px"></div>
    <button class="btn danger" data-act="discard">Discard session</button>
    <div style="height:14px"></div>`;
  return h;
}

function bindSession(){
  document.querySelectorAll('.setrow input').forEach(inp=>{
    inp.addEventListener('input',ev=>{
      const row=ev.target.closest('.setrow');
      const i=+row.dataset.ex, j=+row.dataset.set, f=ev.target.dataset.f;
      DB.active.entries[i][j][f]=ev.target.value;
      row.classList.toggle('done', num(DB.active.entries[i][j].r)!==null);
      row.querySelector('[data-tick]').textContent = num(DB.active.entries[i][j].r)!==null?'\u2713':'\u25cb';
      save();
    });
  });
  /* tick = copy previous set's weight and fill target reps */
  document.querySelectorAll('[data-tick]').forEach(t=>{
    t.onclick=()=>{
      const row=t.closest('.setrow');
      const i=+row.dataset.ex, j=+row.dataset.set;
      const ex=dayById(DB.active.dayId).ex[i];
      const cur=DB.active.entries[i][j];
      if(num(cur.r)!==null){ cur.w=''; cur.r=''; }
      else{
        const prevRow = j>0 ? DB.active.entries[i][j-1] : null;
        const last = lastSessionFor(DB.active.dayId);
        const ls = last ? (last.entries[i]||[])[j] : null;
        cur.w = cur.w || (prevRow&&prevRow.w) || (ls&&ls.w) || '';
        cur.r = cur.r || (ls&&ls.r) || String(ex.lo);
      }
      save(); render();
    };
  });
  document.querySelectorAll('[data-act]').forEach(b=>{
    const a=b.dataset.act;
    if(a==='finish') b.onclick=finishSession;
    if(a==='discard') b.onclick=()=>openSheet(
      `<h2 style="font-size:18px">Discard this session?</h2>
       <div class="small muted" style="margin:9px 0 16px">Everything you\u2019ve logged today will be deleted. This can\u2019t be undone.</div>
       <button class="btn danger" data-act="yes">Discard it</button><div style="height:9px"></div>
       <button class="btn ghost" data-close>Keep logging</button>`,
      {yes:()=>{ DB.active=null; save(); closeSheet(); view={tab:'home',screen:'list'}; render(); toast('Session discarded'); }});
  });
  $('#notesBtn').onclick=()=>openSheet(
    `<h2 style="font-size:18px">Session notes</h2>
     <div class="small muted" style="margin:7px 0 12px">How it felt, niggles, anything worth remembering.</div>
     <textarea id="noteBox" placeholder="Felt strong, left shoulder a bit tight on dips\u2026">${esc(DB.active.note||'')}</textarea>
     <div style="height:12px"></div><button class="btn" data-act="savenote">Save note</button>`,
    {savenote:()=>{ DB.active.note=$('#noteBox').value; save(); closeSheet(); render(); toast('Note saved'); }});
}

function finishSession(){
  const s=DB.active;
  const logged=setsLogged(s);
  if(!logged){ toast('Log at least one set first'); return; }
  openSheet(
    `<h2 style="font-size:18px">Finish ${esc(dayById(s.dayId).name)}?</h2>
     <div class="small muted" style="margin:9px 0 16px">${logged} sets logged \u00b7 ${sessionVolume(s).toLocaleString('en-AU')} kg total volume. It\u2019ll be saved to your history.</div>
     <button class="btn" data-act="yes">Save it</button><div style="height:9px"></div>
     <button class="btn ghost" data-close>Keep logging</button>`,
    {yes:()=>{

      view={tab:'home',screen:'list'}; render(); window.scrollTo(0,0);
      toast('Session saved \u2014 nice work');

function viewStats(){
  const hist=doneSessions();
  if(!hist.length) return `<div class="empty"><div class="big">\u25CB</div><div>Nothing to chart yet.<br>Log a session or two first.</div></div>`;

  const c30=hist.filter(s=>daysAgo(s.date)<30);
  const counts={push:0,pull:0,legs:0};
  c30.forEach(s=>{ const d=dayById(s.dayId); if(d) counts[d.cat]++; });
  const totalV=hist.reduce((a,s)=>a+sessionVolume(s),0);

  let h=`<div class="sec">Last 30 days</div>
  <div class="stats">
    <div class="stat"><div class="n">${c30.length}</div><div class="l">Sessions</div></div>
    <div class="stat"><div class="n">${c30.reduce((a,s)=>a+setsLogged(s),0)}</div><div class="l">Sets</div></div>
    <div class="stat"><div class="n">${(c30.reduce((a,s)=>a+sessionVolume(s),0)/1000).toFixed(1)}t</div><div class="l">Volume</div></div>
  </div>`;

  const max=Math.max(1,...Object.values(counts));
  const spread=Math.max(...Object.values(counts))-Math.min(...Object.values(counts));
  h+=`<div class="sec">Push / pull / legs balance</div>
  <div class="card pad">
    <div class="balance">${Object.keys(CAT).map(c=>`
      <div class="b"><div class="bn" style="color:${CAT[c].colour}">${counts[c]}</div><div class="bl">${CAT[c].label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${counts[c]/max*100}%;background:${CAT[c].colour}"></div></div></div>`).join('')}
    </div>
    <div class="small muted" style="margin-top:11px">${
      spread<=1 ? 'Nicely even \u2014 no category is being neglected.'
      : 'That\u2019s a gap of '+spread+' sessions. A self-directed rotation drifts to the days you enjoy \u2014 worth pulling it back.'
    }</div>
  </div>`;

  h+=`<div class="sec">Session volume</div><div class="card pad">${sparkline(hist.slice(0,14).reverse().map(sessionVolume))}
  <div class="tiny dim" style="margin-top:6px">Last ${Math.min(14,hist.length)} sessions, total kg lifted</div></div>`;

  h+=`<div class="sec">Per exercise</div><div class="card">`;
  const seen=new Set();
  DAYS.forEach(day=>day.ex.forEach((ex,i)=>{
    const key=day.id+'|'+i;
    const runs=hist.filter(s=>s.dayId===day.id && (s.entries[i]||[]).some(x=>num(x.r)));
    if(!runs.length || seen.has(key)) return;
    seen.add(key);
    const best=runs.reduce((b,s)=>{
      const ws=(s.entries[i]||[]).map(x=>num(x.w)||0);
      return Math.max(b,...ws);
    },0);
    h+=`<button class="hrow" data-ex="${day.id}|${i}">
      <div class="hdot" style="background:${ex.core?'var(--core)':CAT[day.cat].colour}"></div>
      <div class="hmain"><div class="hname">${esc(ex.name)}</div>
      <div class="hmeta">${esc(day.name)} \u00b7 ${runs.length} session${runs.length===1?'':'s'}</div></div>
      <div class="hvol">${best?best+' kg':'\u2013'}</div></button>`;
  }));
  h+=`</div><div style="height:14px"></div>`;
  return h;
}
function bindStats(){
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{
    const [d,i]=b.dataset.ex.split('|');
    view.screen='exercise'; view.dayId=d; view.exIdx=+i; render(); window.scrollTo(0,0);
  });
}
function sparkline(vals){
  if(vals.length<2) return `<div class="small dim">Not enough sessions yet.</div>`;
  const w=300,hh=100,pad=6;
  const mx=Math.max(...vals), mn=Math.min(...vals), rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1), hh-pad-((v-mn)/rg)*(hh-2*pad)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none">
    <line class="gl" x1="0" y1="${hh-pad}" x2="${w}" y2="${hh-pad}"/>
    <path class="ln" d="${d}"/>
    ${pts.map(p=>`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"/>`).join('')}
  </svg>`;
}
function viewExercise(){

  const runs=doneSessions().filter(s=>s.dayId===day.id && (s.entries[view.exIdx]||[]).some(x=>num(x.r))).reverse();
  const topSet=runs.map(s=>{
    const sets=(s.entries[view.exIdx]||[]).filter(x=>num(x.r));
    return Math.max(0,...sets.map(x=>num(x.w)||0));
  });
  let h=`<div class="card pad" style="margin-top:14px">
    <div class="row"><div class="grow"><div style="font-weight:700">${target(ex)} &nbsp;<span class="dim small">RIR ${ex.rir}</span></div>
    <div class="small muted" style="margin-top:4px">${esc(ex.note)}</div></div></div></div>`;
  h+=`<div class="sec">Top set weight</div><div class="card pad">${sparkline(topSet)}</div>`;
  h+=`<div class="sec">Every session</div><div class="card">`;
  runs.slice().reverse().forEach(s=>{
    const sets=(s.entries[view.exIdx]||[]).filter(x=>num(x.r));
    const ready=readyToProgress(ex,(s.entries[view.exIdx]||[]));
    h+=`<div class="hrow" style="cursor:default">
      <div class="hmain"><div class="hname" style="font-size:13.5px">${fmtDate(s.date)}${ready?' <span class="tag" style="color:var(--ok)">Ready +</span>':''}</div>
      <div class="hmeta">${sets.map(x=>`${x.w||'\u2013'}\u00d7${x.r}`).join('  \u00b7  ')}</div></div></div>`;
  });
  h+=`</div><div style="height:14px"></div>`;
  return h;
}

/* =========================================================
   MORE
   ========================================================= */
function viewMore(){
  const n=DB.sessions.length;
  return `<div class="sec">Your data</div>
  <div class="card pad">
    <div class="small muted">Everything is stored on this device only \u2014 nothing is uploaded anywhere. ${n} session${n===1?'':'s'} saved.</div>
    <div style="height:13px"></div>
    <button class="btn ghost" data-act="export">Export a backup file</button>
    <div style="height:9px"></div>
    <button class="btn ghost" data-act="import">Restore from a backup</button>
    <input type="file" id="fileIn" accept="application/json" class="hide">
  </div>

  <div class="sec">Install on your phone</div>
  <div class="card pad small muted">
    <b style="color:var(--ink)">iPhone</b> \u2014 open this file in Safari, tap Share, then <b style="color:var(--ink)">Add to Home Screen</b>.<br><br>
    <b style="color:var(--ink)">Android</b> \u2014 open it in Chrome, tap the menu, then <b style="color:var(--ink)">Add to Home screen</b>.<br><br>
    It then opens full screen like a normal app and works with no signal.
  </div>

  <div class="sec">The program</div>
  <div class="card">${RULES.map((r,i)=>`<div class="pad" style="${i?'border-top:1px solid var(--line)':''}">
    <div style="font-weight:700;font-size:13.5px">${esc(r[0])}</div>
    <div class="small muted" style="margin-top:3px">${esc(r[1])}</div></div>`).join('')}</div>

  <div class="sec">Reset</div>
  <div class="card pad"><button class="btn danger" data-act="wipe">Delete all logged data</button></div>
  <div style="height:16px"></div>`;
}
function bindMore(){
  const acts={
    export:()=>{
      const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='training-backup-'+new Date().toISOString().slice(0,10)+'.json';
      a.click(); URL.revokeObjectURL(a.href); toast('Backup downloaded');
    },
    import:()=>$('#fileIn').click(),
    wipe:()=>openSheet(`<h2 style="font-size:18px">Delete everything?</h2>
      <div class="small muted" style="margin:9px 0 16px">All ${DB.sessions.length} logged sessions will be erased. Export a backup first if you\u2019re not sure.</div>
      <button class="btn danger" data-act="yes">Delete all data</button><div style="height:9px"></div>
      <button class="btn ghost" data-close>Cancel</button>`,
      {yes:()=>{ DB={sessions:[],active:null}; save(); closeSheet(); view={tab:'home',screen:'list'}; render(); toast('All data deleted'); }})
  };
  document.querySelectorAll('[data-act]').forEach(b=>{ const f=acts[b.dataset.act]; if(f) b.onclick=f; });
  $('#fileIn').onchange=ev=>{
    const f=ev.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d||!Array.isArray(d.sessions)) throw 0;
        DB=d; DB.active=DB.active||null; save(); render(); toast('Backup restored');
      }catch(err){ toast('That file didn\u2019t look right'); }
    };
    rd.readAsText(f); ev.target.value='';
  };
}

/* =========================================================
   SHEET
   ========================================================= */
let sheetActs={};
function openSheet(html, acts){
  sheetActs=acts||{};
  $('#sheetBody').innerHTML=html;
  $('#sheet').classList.add('on');
  $('#sheetBody').querySelectorAll('[data-act]').forEach(b=>{
    const f=sheetActs[b.dataset.act]; if(f) b.onclick=f;
  });
  $('#sheetBody').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
}
function closeSheet(){ $('#sheet').classList.remove('on'); sheetActs={}; }
document.querySelector('#sheet .scrim').onclick=closeSheet;

/* =========================================================
   GO
   ========================================================= */
render();
window.addEventListener('beforeunload',save);
</script>
